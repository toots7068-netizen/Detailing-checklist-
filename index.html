    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-done: #0f151e;
      --border: #222d40;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --purple: #a78bfa;
      --rose: #fb7185;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(80px + var(--safe-bot));
    }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 15, 23, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + var(--safe-top)) 14px 10px;
    }
    h1 { margin: 0; font-size: 1.06rem; font-weight: 750; letter-spacing: -0.01em; }
    .subtitle { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 9px;
    }
    .stat-label { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .stat-val { font-size: 0.94rem; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stat-val.green { color: var(--green); }
    .stat-val.accent { color: var(--accent); }
    .progress-wrap { margin-top: 9px; display: flex; align-items: center; gap: 10px; }
    .progress-bar { flex: 1; height: 7px; background: #1e293b; border-radius: 999px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width 0.25s ease;
    }
    .progress-txt { font-size: 0.74rem; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .controls { margin-top: 10px; display: flex; gap: 8px; }
    .search-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .toggle-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 0 11px;
      font-size: 0.75rem;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }
    .toggle-btn.active { background: rgba(56, 189, 248, 0.14); border-color: var(--accent); color: var(--accent); }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px 4px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.76rem;
      font-weight: 650;
      cursor: pointer;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #08101c; }
    main { padding: 8px 14px; }
    .phase-banner {
      margin: 14px 0 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #101927;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
    }
    .phase-banner.step1 { border-left-color: var(--amber); }
    .phase-banner.step2 { border-left-color: var(--purple); }
    .phase-banner.step3 { border-left-color: var(--accent); }
    .phase-banner.step4 { border-left-color: var(--green); }
    .phase-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .phase-title { font-size: 0.9rem; font-weight: 750; }
    .phase-sub { font-size: 0.74rem; color: var(--muted); margin-top: 4px; line-height: 1.38; }
    .phase-total { font-size: 0.8rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cat-header {
      margin: 12px 2px 6px;
      font-size: 0.71rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .item-card {
      display: flex;
      gap: 11px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 12px;
      margin-bottom: 8px;
      transition: opacity 0.18s ease, background 0.18s ease;
    }
    .item-card.done { background: var(--card-done); opacity: 0.58; }
    .item-card.done .item-name { text-decoration: line-through; color: var(--muted); }
    .check-btn {
      flex: 0 0 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid #3b4b68;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      margin-top: 2px;
      padding: 0;
    }
    .item-card.done .check-btn { background: var(--green); border-color: var(--green); }
    .check-btn svg { width: 17px; height: 17px; stroke: #07130c; stroke-width: 3; fill: none; display: none; }
    .item-card.done .check-btn svg { display: block; }
    .item-body { flex: 1; min-width: 0; }
    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .brand-line { font-size: 0.69rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
    .item-name { font-size: 0.91rem; font-weight: 650; line-height: 1.28; margin-top: 2px; }
    .price-pill {
      flex: 0 0 auto;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.32);
      color: #86efac;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      text-align: right;

    .price-pill.action { background: rgba(148, 163, 184, 0.12); border-color: var(--border); color: var(--muted); }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
    .pill {
      font-size: 0.69rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #1b2434;
      border: 1px solid #2a374f;
      color: #cbd5e1;
      font-weight: 600;
      text-decoration: none;

    .store-pill.ds { border-color: rgba(56, 189, 248, 0.4); color: #bae6fd; }
    .store-pill.bun { border-color: rgba(34, 197, 94, 0.4); color: #bbf7d0; }

    .footer-actions { margin: 22px 0 12px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn-ghost {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 650;
      cursor: pointer;
    }
    .btn-danger { color: var(--rose); border-color: rgba(251, 113, 133, 0.3); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + var(--safe-bot));
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 60;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .empty { text-align: center; color: var(--muted); padding: 36px 16px; font-size: 0.88rem; }
  </style>
</head>

    const STORAGE_KEY = "detail_setup_3cars_v2";
    let state = loadState();
    let activeStep = "ALL";
    let hideDone = false;
    let searchQuery = "";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { checked: {}, customPrices: {} };
    }
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    function getProductUrl(item) {
      if (item.q.startsWith("http")) return item.q;
      const enc = encodeURIComponent(item.q);
      if (item.storeCls === "ds") return `https://detailingshed.com.au/search?type=product&q=${enc}`;
      if (item.storeCls === "gng") return `https://www.gngsales.com.au/?s=${enc}`;
      if (item.storeCls === "bun") return `https://www.bunnings.com.au/search/products?q=${enc}`;
      return "#";
    }
    function getUnitPrice(item) {
      return state.customPrices[item.id] !== undefined ? Number(state.customPrices[item.id]) : item.unitPrice;
    }
    function getLineTotal(item) {
      return getUnitPrice(item) * item.qty;
    }
    function fmtMoney(n) {
      return "$" + n.toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/\.00$/, "");
    }
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
    }
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Copied: " + text));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Copied: " + text);
      }
    }
    function updateStats() {
      let total = 0, spent = 0, doneCount = 0;
      ITEMS.forEach(item => {
        const line = getLineTotal(item);
        total += line;
        if (state.checked[item.id]) {
          spent += line;
          doneCount++;
        }
      });
      document.getElementById("totalBudget").textContent = fmtMoney(total);
      document.getElementById("spentBudget").textContent = fmtMoney(spent);
      document.getElementById("remBudget").textContent = fmtMoney(Math.max(0, total - spent));
      document.getElementById("progressTxt").textContent = `${doneCount} / ${ITEMS.length}`;
      document.getElementById("progressFill").style.width = (ITEMS.length ? (doneCount / ITEMS.length) * 100 : 0) + "%";
    }

    function render() {
      updateStats();
      const container = document.getElementById("listContainer");
      const q = searchQuery.trim().toLowerCase();

      const filtered = ITEMS.filter(item => {
        if (activeStep !== "ALL" && String(item.step) !== activeStep) return false;
        if (hideDone && state.checked[item.id]) return false;
        if (q) {
          const hay = `${item.brand} ${item.name} ${item.model} ${item.sku} ${item.store} ${item.category} ${item.note}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (!filtered.length) {
        container.innerHTML = `<div class="empty">Nothing left matching this filter.</div>`;
        return;
      }

      const stepsToShow = [...new Set(filtered.map(i => i.step))].sort((a, b) => a - b);
      let html = "";

      stepsToShow.forEach(stepNum => {
        const stepItems = filtered.filter(i => i.step === stepNum);
        const stepTotal = ITEMS.filter(i => i.step === stepNum).reduce((s, i) => s + getLineTotal(i), 0);
        const info = STEPS[stepNum];

        html += `
          <div class="phase-banner ${info.cls}">
            <div class="phase-head">
              <div class="phase-title">${info.title}</div>
              <div class="phase-total">${stepTotal > 0 ? fmtMoney(stepTotal) : "Prep"}</div>
            </div>
            <div class="phase-sub">${info.sub}</div>
          </div>
        `;

        const cats = [...new Set(stepItems.map(i => i.category))];
        cats.forEach(cat => {
          html += `<div class="cat-header">${cat}</div>`;
          stepItems.filter(i => i.category === cat).forEach(item => {
            const done = !!state.checked[item.id];
            const unit = getUnitPrice(item);
            const line = unit * item.qty;
            const isCustom = state.customPrices[item.id] !== undefined;
            const estMark = !isCustom && item.isEst ? "~" : "";
            const priceLabel = item.isAction ? "ACTION" : `${estMark}${fmtMoney(line)}`;
            const subQty = item.qty > 1 && !item.isAction ? `<div style="font-size:0.64rem;font-weight:500;opacity:0.85;">${item.qty} × ${fmtMoney(unit)}</div>` : "";
            const href = getProductUrl(item);

            html += `
              <div class="item-card ${done ? "done" : ""}" data-id="${item.id}">
                <button class="check-btn" aria-label="Toggle bought">
                  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
                <div class="item-body">
                  <div class="item-top">
                    <div>
                      <div class="brand-line">${item.brand} • ${item.model}</div>
                      <div class="item-name">${item.name}</div>
                    </div>
                    <div class="price-pill ${item.isAction ? "action" : (!isCustom && item.isEst ? "est" : "")}" data-action="edit-price">
                      ${priceLabel}${subQty}
                    </div>
                  </div>
                  <div class="meta-row">
                    <span class="pill store-pill ${item.storeCls}">${item.store}</span>
                    <span class="pill sku-pill" data-action="copy-sku" data-sku="${item.sku}">SKU: ${item.sku}</span>
                    <a class="pill link-pill" href="${href}" target="_blank" rel="noopener noreferrer">Open Product ↗</a>
                  </div>
                  <div class="note-txt">${item.note}</div>
                </div>
              </div>
            `;
          });
        });
      });

      container.innerHTML = html;
    }

    document.getElementById("listContainer").addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      const card = e.target.closest(".item-card");
      if (!card) return;
      const id = card.dataset.id;
      const item = ITEMS.find(i => i.id === id);

      if (e.target.closest("[data-action='copy-sku']")) {
        copyText(e.target.closest("[data-action='copy-sku']").dataset.sku);
        return;
      }

      if (e.target.closest("[data-action='edit-price']")) {
        if (item.isAction) return;
        const cur = getUnitPrice(item);
        const input = prompt(`Enter UNIT price (AUD) for:\n${item.brand} ${item.name}\n(Qty: ${item.qty})`, cur);
        if (input !== null && input.trim() !== "" && !isNaN(Number(input))) {
          state.customPrices[id] = Math.max(0, Number(input));
          saveState();
          render();
          showToast("Price updated");
        }
        return;
      }

      state.checked[id] = !state.checked[id];
      saveState();
      render();
    });

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      activeStep = btn.dataset.step;
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    document.getElementById("hideDoneBtn").addEventListener("click", (e) => {
      hideDone = !hideDone;
      e.target.classList.toggle("active", hideDone);
      render();
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const rem = ITEMS.filter(i => !state.checked[i.id]);
      if (!rem.length) { showToast("Everything is ticked off!"); return; }
      const text = rem.map(i => `[Order ${i.step} | ${i.store}] ${i.brand} - ${i.name} (${i.sku}) x${i.qty} = ${fmtMoney(getLineTotal(i))}`).join("\n");
      copyText(text);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Reset all ticks and custom prices?")) {
        state = { checked: {}, customPrices: {} };
        saveState();
        render();
        showToast("Checklist reset");
      }
    });

    render();
  </script>
</body>
</html>
