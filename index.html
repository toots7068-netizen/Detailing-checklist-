    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-done: #0f151e;
      --border: #222d40;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --purple: #a78bfa;
      --rose: #fb7185;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(80px + var(--safe-bot));
    }
    header {

      top: 0;
      z-index: 30;
      background: rgba(11, 15, 23, 0.94);
      backdrop-filter: blur(12px);

      font-weight: 750;

    .subtitle {

      color: var(--muted);
      margin-top: 2px;
    }
    .stats-grid {

      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .stat-box {

      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 9px;
    }
    .stat-label {

      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .stat-val {

      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .stat-val.green { color: var(--green); }
    .stat-val.accent { color: var(--accent); }
    .progress-wrap {

      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-bar {

      height: 7px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width 0.25s ease;
    }
    .progress-txt {
      font-size: 0.74rem;
      font-weight: 650;
      color: var(--muted);
      font-variant-numeric: tabular-nums;

      gap: 8px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      color: var(--text);
      font-size: 0.85rem;

    .search-input:focus { border-color: var(--accent); }
    .toggle-btn {

      color: var(--muted);
      border-radius: 10px;

      font-size: 0.75rem;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;

    .toggle-btn.active {

      border-color: var(--accent);
      color: var(--accent);

      gap: 6px;
      overflow-x: auto;
      padding: 10px 14px 4px;
      scrollbar-width: none;

    .tabs::-webkit-scrollbar { display: none; }
    .tab {

      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.76rem;
      font-weight: 650;
      cursor: pointer;

    .tab.active {

      border-color: var(--accent);
      color: #08101c;

      border: 1px solid var(--accent);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 60;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 36px 16px;
      font-size: 0.88rem;

</head>
